<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gate Scanner | Freshers Pass</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { padding-bottom: 40px; }
        
        .scan-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 24px;
        }

        #reader {
            width: 100%;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: black;
        }
        #reader video { border-radius: var(--radius-md); }
        
        #reader__dashboard_section_csr,
        #reader__filescan_input,
        #reader__status_span,
        #reader__header_message {
            display: none !important;
        }

        .banner {
            border-radius: var(--radius-md);
            padding: 32px 24px;
            text-align: center;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            transition: all 0.2s;
            margin-bottom: 24px;
        }

        .banner .status-word {
            font-size: 28px;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .banner .status-sub {
            color: var(--text-muted);
            font-size: 15px;
        }

        .banner.idle { opacity: 0.8; }
        
        .banner.go {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
        }
        .banner.go .status-word { color: var(--success); }
        .banner.go .status-sub { color: #a7f3d0; }

        .banner.stop {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
        }
        .banner.stop .status-word { color: var(--danger); }
        .banner.stop .status-sub { color: #fecaca; }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding-top: 16px;
            margin-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }
        .detail-row span:first-child { color: var(--text-muted); }
        .detail-row span:last-child { font-weight: 700; color: white; }

        .manual-entry {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
        }
        
        .manual-entry summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            outline: none;
        }
    </style>
</head>
<body>
    <nav class="navbar mb-6">
        <div class="container navbar-inner">
            <div class="brand">Gate Scanner</div>
            <div class="nav-links">
                <span class="nav-link text-muted" id="event-label">Connecting...</span>
                <a href="/admin-page" class="nav-link hidden" id="admin-link">Admin</a>
                <a href="#" class="nav-link text-danger" id="logout-btn">Log out</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 500px;">
        <div class="flex justify-between items-center mb-4 text-sm">
            <div class="text-muted">Live Gate Stats</div>
            <div id="stats" class="font-bold">- / -</div>
        </div>

        <div class="scan-card">
            <div id="reader"></div>
            <div class="grid grid-cols-2 gap-4 mt-4">
                <button class="btn btn-secondary" id="toggle-cam">Flip Camera</button>
                <button class="btn btn-primary" id="toggle-scan">Pause Scanning</button>
            </div>
        </div>

        <div class="banner idle" id="banner">
            <div class="status-word" id="status-word">Scan Pass</div>
            <div class="status-sub" id="status-sub">Point camera at QR code</div>
        </div>

        <details class="manual-entry">
            <summary>Enter Code Manually</summary>
            <div class="form-group mt-4">
                <textarea id="manual-token" class="form-control" rows="3" placeholder="Paste the raw token here"></textarea>
            </div>
            <button id="manual-submit" class="btn btn-secondary" style="width: 100%;">Verify Pass</button>
        </details>
    </div>

    <script>
        const API_VERIFY = "/verify";
        const API_STATS = "/gate-stats";
        const API_ME = "/me";
        const SCAN_COOLDOWN_MS = 2000;

        let html5QrCode;
        let cameras = [];
        let currentCameraIndex = 0;
        let isPaused = false;
        let isBusy = false;
        let lastScanTime = 0;

        const bannerEl = document.getElementById("banner");
        const statusWordEl = document.getElementById("status-word");
        const statusSubEl = document.getElementById("status-sub");
        const statsEl = document.getElementById("stats");
        const eventLabelEl = document.getElementById("event-label");

        // --- Audio ---
        let audioCtx = null;
        function ensureAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function beep(frequency, durationMs, type = "sine") {
            try {
                ensureAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = frequency;
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationMs / 1000);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + durationMs / 1000);
            } catch (e) {}
        }
        function playAllow() { beep(880, 160); setTimeout(() => beep(1174, 180), 140); }
        function playDeny()  { beep(220, 260, "square"); }

        // --- UI Updates ---
        function setIdle(message) {
            bannerEl.className = "banner idle";
            statusWordEl.textContent = message || "Scan Pass";
            statusSubEl.textContent = "Point camera at QR code";
            bannerEl.querySelectorAll('.detail-row').forEach(e => e.remove());
        }
        
        function addDetailRow(label, value) {
            const row = document.createElement("div");
            row.className = "detail-row";
            row.innerHTML = `<span>${label}</span><span>${value}</span>`;
            bannerEl.appendChild(row);
        }
        
        function setAllow(name, sapId) {
            bannerEl.className = "banner go";
            statusWordEl.textContent = "ENTRY ALLOWED";
            statusSubEl.textContent = "Issue wristband now";
            bannerEl.querySelectorAll('.detail-row').forEach(e => e.remove());
            addDetailRow("Student", name);
            addDetailRow("SAP ID", sapId);
            playAllow();
            if (navigator.vibrate) navigator.vibrate(120);
        }
        
        function setDeny(reason) {
            bannerEl.className = "banner stop";
            statusWordEl.textContent = "ENTRY DENIED";
            statusSubEl.textContent = reason;
            bannerEl.querySelectorAll('.detail-row').forEach(e => e.remove());
            playDeny();
            if (navigator.vibrate) navigator.vibrate([100, 60, 100]);
        }

        // --- Auth ---
        async function requireAuth() {
            try {
                const res = await fetch(API_ME);
                if (!res.ok) return window.location.href = "/login-page";
                const me = await res.json();
                if (!["volunteer", "admin"].includes(me.role)) return window.location.href = "/login-page";
                eventLabelEl.textContent = me.full_name;
                if (me.role === 'admin') document.getElementById('admin-link').classList.remove('hidden');
                return true;
            } catch (e) {
                window.location.href = "/login-page";
                return false;
            }
        }

        document.getElementById("logout-btn").addEventListener("click", async (e) => {
            e.preventDefault();
            await fetch("/logout", { method: "POST" });
            window.location.href = "/login-page";
        });

        // --- Stats ---
        async function refreshStats() {
            try {
                const res = await fetch(API_STATS);
                if (!res.ok) return;
                const data = await res.json();
                statsEl.innerHTML = `<span class="text-success">${data.total_entered} In</span> · <span class="text-warning">${data.pending_entry} Pending</span>`;
            } catch (e) {}
        }

        // --- Verify ---
        async function verifyToken(token) {
            if (isBusy) return;
            const now = Date.now();
            if (now - lastScanTime < SCAN_COOLDOWN_MS) return;
            lastScanTime = now;
            isBusy = true;

            setIdle("Checking...");
            try {
                const res = await fetch(API_VERIFY, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();

                if (res.status === 401) window.location.href = "/login-page";
                else if (res.ok) setAllow(data.student_name, data.sap_id);
                else setDeny(data.detail || "Verification failed");
            } catch (e) {
                setDeny("Network error");
            } finally {
                refreshStats();
                isBusy = false;
            }
        }

        // --- Camera ---
        async function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            try {
                cameras = await Html5Qrcode.getCameras();
            } catch (e) {
                return setDeny("Camera permission denied");
            }
            if (!cameras || cameras.length === 0) return setDeny("No camera found");

            currentCameraIndex = cameras.findIndex(c => /back|rear|environment/i.test(c.label));
            if (currentCameraIndex === -1) currentCameraIndex = 0;

            await runCamera(cameras[currentCameraIndex].id);
        }

        async function runCamera(cameraId) {
            await html5QrCode.start(
                cameraId,
                { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
                (decodedText) => verifyToken(decodedText.trim()),
                () => {}
            );
        }

        document.getElementById("toggle-cam").addEventListener("click", async () => {
            if (cameras.length < 2) return;
            currentCameraIndex = (currentCameraIndex + 1) % cameras.length;
            await html5QrCode.stop();
            await runCamera(cameras[currentCameraIndex].id);
        });

        document.getElementById("toggle-scan").addEventListener("click", async (e) => {
            const btn = e.target;
            if (!isPaused) {
                await html5QrCode.pause(true);
                isPaused = true;
                btn.textContent = "Resume";
                setIdle("Scanning paused");
            } else {
                await html5QrCode.resume();
                isPaused = false;
                btn.textContent = "Pause Scanning";
                setIdle("Scan Pass");
            }
        });

        document.getElementById("manual-submit").addEventListener("click", () => {
            const val = document.getElementById("manual-token").value.trim();
            if (val) {
                lastScanTime = 0;
                verifyToken(val);
                document.getElementById("manual-token").value = '';
            }
        });

        (async () => {
            if (await requireAuth()) {
                startScanner();
                refreshStats();
                setInterval(refreshStats, 8000);
            }
        })();
    </script>
</body>
</html>
