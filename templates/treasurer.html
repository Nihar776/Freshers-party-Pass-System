<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasurer Dashboard | Freshers Pass</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .tab-nav {
            display: flex;
            gap: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-family: 'Inter', sans-serif;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .queue-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 16px;
        }
        
        #modal-bg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #modal-bg.active { display: flex; }
        .modal-content {
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    
    <nav class="navbar">
        <div class="container navbar-inner">
            <div class="brand">Treasury</div>
            <div class="nav-links">
                <span class="nav-link text-muted" id="user-name">Loading...</span>
                <a href="/admin-page" class="nav-link hidden" id="admin-link">Admin</a>
                <a href="#" class="nav-link text-danger" id="logout-btn">Log out</a>
            </div>
        </div>
    </nav>

    <div class="container mt-6 mb-8">
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('verify')">Verification Queue</button>
            <button class="tab-btn" onclick="switchTab('expenses')">Expenses</button>
            <button class="tab-btn" onclick="switchTab('budget')">Budgeting</button>
        </div>

        <!-- Verification Queue -->
        <div id="verify-tab" class="tab-content active">
            <div class="flex justify-between items-center mb-4">
                <h3 id="queue-title">Pending UPI Approvals</h3>
                <button class="btn btn-secondary" onclick="loadQueue()">Refresh</button>
            </div>
            
            <div id="queue-list">
                <div class="text-muted text-center py-4 panel">Loading...</div>
            </div>
        </div>

        <!-- Expenses -->
        <div id="expenses-tab" class="tab-content">
            <div class="grid grid-cols-2 gap-6">
                <div class="panel">
                    <h3 class="mb-4">Record New Expense</h3>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <input type="text" id="exp-desc" class="form-control" placeholder="What was purchased?">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <input type="text" id="exp-cat" class="form-control" placeholder="e.g. Food, Decor, DJ">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Fund Type</label>
                        <select id="exp-fund" class="form-control">
                            <option value="cash">Cash (Paid from physical collection)</option>
                            <option value="upi">UPI (Paid from bank account)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" id="exp-amt" class="form-control">
                    </div>
                    <button class="btn btn-primary" style="width: 100%;" onclick="submitExpense()">Save Expense</button>
                </div>
                
                <div class="panel">
                    <h3 class="mb-4">Budget Summary</h3>
                    <div id="budget-summary" class="text-muted">Loading...</div>
                </div>
            </div>
        </div>

        <!-- Budget -->
        <div id="budget-tab" class="tab-content">
            <div class="panel" style="max-width: 500px;">
                <h3 class="mb-4">Allocate Budget</h3>
                <p class="text-muted text-sm mb-4">Set limits for specific categories. This helps track over/under spending.</p>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <input type="text" id="bud-cat" class="form-control" placeholder="e.g. DJ">
                </div>
                <div class="form-group">
                    <label class="form-label">Fund Type</label>
                    <select id="bud-fund" class="form-control">
                        <option value="cash">Cash</option>
                        <option value="upi">UPI</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Allocated Amount (₹)</label>
                    <input type="number" id="bud-amt" class="form-control">
                </div>
                <button class="btn btn-primary" style="width: 100%;" onclick="submitBudget()">Set Budget Limit</button>
            </div>
        </div>
    </div>

    <!-- Reusable Modal -->
    <div id="modal-bg">
        <div class="modal-content" id="modal-content"></div>
    </div>

    <script>
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        async function init() {
            const res = await fetch('/me');
            if (!res.ok) return window.location.href = '/login-page';
            const me = await res.json();
            if (me.role !== 'treasurer' && me.role !== 'admin') return window.location.href = '/login-page';
            
            document.getElementById('user-name').textContent = me.full_name;
            if (me.role === 'admin') document.getElementById('admin-link').classList.remove('hidden');
            
            loadQueue();
        }

        document.getElementById('logout-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/logout', { method: 'POST' });
            window.location.href = '/login-page';
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`${tab}-tab`).classList.add('active');
            if (tab === 'verify') loadQueue();
            if (tab === 'expenses') loadBudgetSummary(); // Implement later if backend supports it
        }

        // --- Queue ---
        async function loadQueue() {
            const res = await fetch('/treasurer/pending-verifications');
            const items = await res.json();
            const el = document.getElementById('queue-list');
            document.getElementById('queue-title').textContent = `Pending UPI Approvals (${items.length})`;
            
            if (items.length === 0) {
                el.innerHTML = `<div class="panel text-center text-muted">No pending verifications 🎉</div>`;
                return;
            }
            
            el.innerHTML = items.map(item => `
                <div class="queue-card">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <div class="font-bold" style="font-size: 16px;">${item.name} <span class="text-muted text-sm ml-2">${item.sap_id}</span></div>
                            <div class="text-muted mt-1">${item.branch} · ₹${item.amount}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold">UTR: ${item.utr_number || 'N/A'}</div>
                            <div class="text-muted text-sm">Sold by ${item.distributor_name}</div>
                        </div>
                    </div>
                    
                    ${item.duplicate_screenshot_warning ? '<div class="badge badge-warning mb-4">⚠ Screenshot reused elsewhere</div>' : ''}
                    
                    <div class="flex gap-4 mt-4">
                        <button class="btn btn-secondary" onclick="viewScreenshot(${item.student_id})">🔍 View Screenshot</button>
                        <button class="btn btn-success" onclick="approve(${item.student_id})" style="flex:1">Approve</button>
                        <button class="btn btn-danger" onclick="openReject(${item.student_id})" style="flex:1">Reject</button>
                    </div>
                </div>
            `).join('');
        }

        // --- Modals ---
        function closeModal() { document.getElementById('modal-bg').classList.remove('active'); }
        
        document.getElementById('modal-bg').addEventListener('click', (e) => {
            if (e.target.id === 'modal-bg') closeModal();
        });

        async function viewScreenshot(id) {
            const res = await fetch(`/treasurer/pending-verifications/${id}/screenshot`);
            if (!res.ok) { showToast("No screenshot on file", "error"); return; }
            const data = await res.json();
            
            document.getElementById('modal-content').innerHTML = `
                <h3 class="mb-4">Screenshot for ${data.sap_id}</h3>
                <img src="data:image/png;base64,${data.screenshot_base64}" style="width: 100%; border-radius: var(--radius-sm); margin-bottom: 20px;">
                <button class="btn btn-secondary w-full" style="width:100%" onclick="closeModal()">Close</button>
            `;
            document.getElementById('modal-bg').classList.add('active');
        }

        function openReject(id) {
            document.getElementById('modal-content').innerHTML = `
                <h3 class="mb-4">Reject Payment</h3>
                <div class="form-group">
                    <label class="form-label">Rejection Reason</label>
                    <textarea id="reject-reason" class="form-control" rows="3" placeholder="e.g. UTR not found in bank statement, amount mismatch"></textarea>
                </div>
                <div class="flex gap-4">
                    <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-danger" style="flex:1" onclick="submitReject(${id})">Confirm Reject</button>
                </div>
            `;
            document.getElementById('modal-bg').classList.add('active');
        }

        async function approve(id) {
            if (!confirm("Approve this payment? The pass will be emailed immediately.")) return;
            const res = await fetch(`/treasurer/verify/${id}`, { method: 'POST' });
            if (res.ok) {
                showToast("Payment approved, pass emailed");
                loadQueue();
            } else {
                const data = await res.json();
                showToast(data.detail || "Approval failed", "error");
            }
        }

        async function submitReject(id) {
            const reason = document.getElementById('reject-reason').value.trim();
            if (!reason) { showToast("Please enter a reason", "error"); return; }
            
            const res = await fetch(`/treasurer/reject/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reason })
            });
            
            if (res.ok) {
                showToast("Payment rejected");
                closeModal();
                loadQueue();
            } else {
                const data = await res.json();
                showToast(data.detail || "Rejection failed", "error");
            }
        }

        // --- Expenses & Budget ---
        async function submitExpense() {
            const formData = new FormData();
            formData.append("description", document.getElementById("exp-desc").value);
            formData.append("category", document.getElementById("exp-cat").value);
            formData.append("fund_type", document.getElementById("exp-fund").value);
            formData.append("amount", document.getElementById("exp-amt").value);
            
            const res = await fetch("/treasurer/expenses", { method: "POST", body: formData });
            if (res.ok) {
                showToast("Expense recorded successfully");
                document.getElementById("exp-desc").value = "";
                document.getElementById("exp-cat").value = "";
                document.getElementById("exp-amt").value = "";
            } else {
                const data = await res.json();
                showToast(data.detail || "Failed to record expense", "error");
            }
        }

        async function submitBudget() {
            const payload = {
                category: document.getElementById("bud-cat").value,
                fund_type: document.getElementById("bud-fund").value,
                allocated_amount: parseFloat(document.getElementById("bud-amt").value)
            };
            
            const res = await fetch("/treasurer/budget", { 
                method: "POST", 
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            
            if (res.ok) {
                showToast("Budget allocated successfully");
                document.getElementById("bud-cat").value = "";
                document.getElementById("bud-amt").value = "";
            } else {
                const data = await res.json();
                showToast(data.detail || "Failed to allocate budget", "error");
            }
        }

        function loadBudgetSummary() {
            document.getElementById('budget-summary').innerHTML = '<p>Check admin overview for net collection and total expenses.</p>';
        }

        init();
        setInterval(() => {
            if (document.getElementById('verify-tab').classList.contains('active')) {
                loadQueue();
            }
        }, 15000);
    </script>
</body>
</html>
