<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributor Dashboard | Freshers Pass</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .result-item {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-item:hover {
            border-color: var(--primary);
            background: rgba(99, 56, 240, 0.05);
        }
        .result-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .cart-item {
            padding: 12px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .payer-radio {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .text-danger {
            color: var(--danger);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .text-danger:hover { text-decoration: underline; }
        
        .tab-nav {
            display: flex;
            gap: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-family: 'Inter', sans-serif;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    
    <nav class="navbar">
        <div class="container navbar-inner">
            <div class="brand">Freshers Pass</div>
            <div class="nav-links">
                <span class="nav-link" id="user-name">Loading...</span>
                <a href="#" class="nav-link" id="logout-btn">Log out</a>
            </div>
        </div>
    </nav>

    <div class="container mt-6">
        <!-- Stats Row -->
        <div class="grid grid-cols-3 mb-6">
            <div class="stat-card">
                <div class="stat-label">Total Passes Sold</div>
                <div class="stat-value" id="stat-sold">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Cash Collected</div>
                <div class="stat-value" id="stat-collected">₹0</div>
            </div>
            <div class="stat-card" style="border-color: var(--warning);">
                <div class="stat-label" style="color: var(--warning);">Outstanding Cash</div>
                <div class="stat-value" id="stat-outstanding">₹0</div>
            </div>
        </div>

        <div class="panel">
            <div class="tab-nav">
                <button class="tab-btn active" onclick="switchTab('sell')">Sell Passes</button>
                <button class="tab-btn" onclick="switchTab('history')">My Sales History</button>
            </div>

            <!-- Sell Tab -->
            <div id="sell-tab" class="tab-content active">
                <div class="grid grid-cols-2 gap-6">
                    <!-- Left: Search -->
                    <div>
                        <h3 class="mb-4">1. Search Roster</h3>
                        <div class="form-group">
                            <input type="text" id="search" class="form-control" placeholder="Search by name or SAP ID (e.g., 5001...)">
                        </div>
                        <div id="results" class="grid gap-2">
                            <!-- Search results go here -->
                        </div>
                    </div>

                    <!-- Right: Cart & Checkout -->
                    <div>
                        <h3 class="mb-4">2. Cart & Checkout</h3>
                        <div id="cart-list" class="grid gap-2 mb-4">
                            <div class="text-muted text-center py-4" style="padding: 20px 0;">Cart is empty. Search and click students to add.</div>
                        </div>

                        <div id="checkout-form" class="hidden">
                            <div class="panel mb-4" style="background: var(--bg-dark); padding: 16px;">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-muted">Base Price (Fixed)</span>
                                    <span class="font-bold">₹499</span>
                                </div>
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-muted">Group Discount</span>
                                    <span class="font-bold text-success" id="discount-pct">0%</span>
                                </div>
                                <div class="flex justify-between items-center mt-4 pt-4" style="border-top: 1px solid var(--border);">
                                    <span class="font-bold">Total Amount</span>
                                    <span class="stat-value" id="total-amount" style="font-size: 24px;">₹0</span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Payment Mode</label>
                                <select id="payment-mode" class="form-control">
                                    <option value="cash">Cash (Instant Verification)</option>
                                    <option value="upi">UPI (Pending Treasurer Review)</option>
                                </select>
                            </div>

                            <div id="upi-fields" class="hidden">
                                <div class="form-group">
                                    <label class="form-label">UTR Number</label>
                                    <input type="text" id="utr" class="form-control" placeholder="12-digit transaction ID">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Payment Screenshot</label>
                                    <input type="file" id="screenshot" class="form-control" accept="image/*">
                                </div>
                            </div>

                            <button id="submit-sale" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px;">Confirm Sale</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- History Tab -->
            <div id="history-tab" class="tab-content">
                <div class="flex justify-between items-center mb-4">
                    <h3>Recent Sales</h3>
                    <button class="btn btn-secondary" onclick="loadHistory()">Refresh</button>
                </div>
                <div class="table-container">
                    <table id="history-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>SAP ID</th>
                                <th>Mode</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        const BASE_PRICE = 499.0;

        // --- Core Auth & Toast ---
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        async function init() {
            const res = await fetch('/me');
            if (!res.ok) return window.location.href = '/login-page';
            const me = await res.json();
            if (me.role !== 'distributor' && me.role !== 'admin') return window.location.href = '/login-page';
            document.getElementById('user-name').textContent = me.full_name;
            loadStats();
        }

        document.getElementById('logout-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/logout', { method: 'POST' });
            window.location.href = '/login-page';
        });

        // --- Stats & History ---
        async function loadStats() {
            const res = await fetch('/distributor/my-cash-balance');
            if (res.ok) {
                const data = await res.json();
                document.getElementById('stat-collected').textContent = `₹${data.total_cash_collected.toFixed(2)}`;
                document.getElementById('stat-outstanding').textContent = `₹${data.outstanding_with_you.toFixed(2)}`;
            }
            
            const res2 = await fetch('/distributor/my-sales');
            if (res2.ok) {
                const sales = await res2.json();
                document.getElementById('stat-sold').textContent = sales.length;
            }
        }

        async function loadHistory() {
            const res = await fetch('/distributor/my-sales');
            if (!res.ok) return;
            const sales = await res.json();
            const tbody = document.querySelector('#history-table tbody');
            tbody.innerHTML = sales.map(s => {
                let badgeClass = 'badge-neutral';
                if (s.payment_status === 'verified') badgeClass = 'badge-success';
                else if (s.payment_status === 'pending_verification') badgeClass = 'badge-warning';
                else if (s.payment_status === 'rejected') badgeClass = 'badge-danger';
                
                return `<tr>
                    <td class="font-semibold">${s.name}</td>
                    <td>${s.sap_id}</td>
                    <td><span class="badge ${s.payment_mode === 'cash' ? 'badge-success' : 'badge-neutral'}">${s.payment_mode || '-'}</span></td>
                    <td>₹${(s.amount || 0).toFixed(2)}</td>
                    <td><span class="badge ${badgeClass}">${s.payment_status.replace('_', ' ')}</span></td>
                    <td class="text-muted text-sm">${new Date(s.sold_at).toLocaleString()}</td>
                </tr>`;
            }).join('');
        }

        // --- Tabs ---
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`${tab}-tab`).classList.add('active');
            if (tab === 'history') loadHistory();
        }

        // --- Search & Cart ---
        let searchTimer = null;
        document.getElementById('search').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            const q = e.target.value.trim();
            if (q.length < 2) { document.getElementById('results').innerHTML = ''; return; }
            searchTimer = setTimeout(() => runSearch(q), 300);
        });

        async function runSearch(q) {
            const res = await fetch(`/distributor/search?query=${encodeURIComponent(q)}`);
            if (!res.ok) return;
            const students = await res.json();
            const resultsEl = document.getElementById('results');
            
            if (students.length === 0) {
                resultsEl.innerHTML = '<div class="text-muted text-center py-4">No results found.</div>';
                return;
            }
            
            resultsEl.innerHTML = students.map(s => {
                const inCart = cart.find(c => c.sap_id === s.sap_id);
                const canBuy = s.payment_status === 'not_purchased' || s.payment_status === 'rejected';
                const disabled = inCart || !canBuy;
                
                let statusBadge = '';
                if (s.payment_status === 'verified') statusBadge = '<span class="badge badge-success">Verified</span>';
                else if (s.payment_status === 'pending_verification') statusBadge = '<span class="badge badge-warning">Pending</span>';
                
                return `
                <div class="result-item ${disabled ? 'disabled' : ''}" onclick="!${disabled} && addToCart(${JSON.stringify(s).replace(/"/g, '&quot;')})">
                    <div>
                        <div class="font-semibold">${s.name} ${inCart ? '<span class="badge badge-neutral">In Cart</span>' : ''}</div>
                        <div class="text-muted text-sm">${s.sap_id} · ${s.branch}</div>
                    </div>
                    <div>${statusBadge}</div>
                </div>`;
            }).join('');
        }

        function addToCart(student) {
            if (cart.length === 0) {
                student.is_payer = true; // First person defaults to payer
            } else {
                student.is_payer = false;
            }
            cart.push(student);
            document.getElementById('search').value = '';
            document.getElementById('results').innerHTML = '';
            updateCartUI();
        }

        function removeFromCart(sap_id) {
            const item = cart.find(c => c.sap_id === sap_id);
            cart = cart.filter(c => c.sap_id !== sap_id);
            if (item && item.is_payer && cart.length > 0) {
                cart[0].is_payer = true; // Reassign payer if removed
            }
            updateCartUI();
        }

        function setPayer(sap_id) {
            cart.forEach(c => c.is_payer = (c.sap_id === sap_id));
        }

        function updateCartUI() {
            const listEl = document.getElementById('cart-list');
            const checkoutEl = document.getElementById('checkout-form');
            
            if (cart.length === 0) {
                listEl.innerHTML = '<div class="text-muted text-center py-4" style="padding: 20px 0;">Cart is empty. Search and click students to add.</div>';
                checkoutEl.classList.add('hidden');
                return;
            }
            
            checkoutEl.classList.remove('hidden');
            
            listEl.innerHTML = cart.map(s => `
                <div class="cart-item">
                    <div>
                        <div class="font-semibold">${s.name}</div>
                        <div class="text-muted text-sm">${s.sap_id}</div>
                    </div>
                    <div class="cart-item-actions">
                        <label class="flex items-center gap-2" style="cursor: pointer;">
                            <input type="radio" name="payer" class="payer-radio" ${s.is_payer ? 'checked' : ''} onclick="setPayer('${s.sap_id}')">
                            <span class="text-sm">Payer</span>
                        </label>
                        <span class="text-danger" onclick="removeFromCart('${s.sap_id}')">Remove</span>
                    </div>
                </div>
            `).join('');
            
            // Calculate pricing
            const groupSize = cart.length;
            let discount = 0;
            const today = new Date();
            if (today.getMonth() === 8) { // September
                if (today.getDate() === 21) {
                    if (groupSize >= 8) discount = 0.12;
                    else if (groupSize >= 6) discount = 0.10;
                } else if (today.getDate() === 22) {
                    if (groupSize >= 10) discount = 0.12;
                    else if (groupSize >= 8) discount = 0.10;
                }
            }
            
            const totalBase = BASE_PRICE * groupSize;
            const finalTotal = totalBase * (1 - discount);
            
            document.getElementById('discount-pct').textContent = `${discount * 100}%`;
            document.getElementById('total-amount').textContent = `₹${finalTotal.toFixed(2)}`;
        }

        // --- Checkout ---
        document.getElementById('payment-mode').addEventListener('change', (e) => {
            document.getElementById('upi-fields').className = e.target.value === 'upi' ? '' : 'hidden';
        });

        document.getElementById('submit-sale').addEventListener('click', async () => {
            if (cart.length === 0) return;
            const btn = document.getElementById('submit-sale');
            btn.disabled = true; 
            btn.textContent = 'Processing...';

            const mode = document.getElementById('payment-mode').value;
            const payer = cart.find(c => c.is_payer);
            
            const formData = new FormData();
            
            if (cart.length === 1) {
                // Single sale
                formData.append('sap_id', cart[0].sap_id);
                formData.append('payment_mode', mode);
            } else {
                // Group sale
                cart.forEach(c => formData.append('sap_ids', c.sap_id));
                formData.append('payer_sap_id', payer.sap_id);
                formData.append('payment_mode', mode);
            }

            if (mode === 'upi') {
                formData.append('utr_number', document.getElementById('utr').value.trim());
                const file = document.getElementById('screenshot').files[0];
                if (file) formData.append('screenshot', file);
            }

            const endpoint = cart.length === 1 ? '/distributor/sell' : '/distributor/sell-group';

            try {
                const res = await fetch(endpoint, { method: 'POST', body: formData });
                const data = await res.json();
                
                if (res.ok) {
                    let msg = data.message;
                    if (data.duplicate_screenshot_warning) msg += " (Warning: Screenshot matches another record)";
                    showToast(msg);
                    cart = [];
                    updateCartUI();
                    document.getElementById('utr').value = '';
                    document.getElementById('screenshot').value = '';
                    loadStats();
                } else {
                    showToast(data.detail || 'Sale failed', 'error');
                }
            } catch (e) {
                showToast('Network error', 'error');
            }
            
            btn.disabled = false;
            btn.textContent = 'Confirm Sale';
        });

        init();
    </script>
</body>
</html>
