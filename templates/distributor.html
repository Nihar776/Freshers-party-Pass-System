<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sell a Pass</title>
<style>
  :root {
    --bg:#0b0c12; --panel:#14151f; --line:#262837; --ink:#eef0f6; --dim:#8b8ea3;
    --accent:#7c5cff; --go:#1fb45c; --go-bg:#0d2617; --stop:#ef3b5c; --stop-bg:#2a0f16;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  .wrap { max-width:480px; margin:0 auto; padding:16px 16px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; padding:8px 2px 18px; }
  h1 { font-size:18px; margin:0; }
  .dim { color:var(--dim); font-size:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:12.5px; color:var(--dim); margin:12px 0 6px; }
  label:first-child { margin-top:0; }
  input, select { width:100%; padding:11px 12px; background:#0f1019; border:1px solid var(--line); border-radius:10px; color:var(--ink); font-size:15px; }
  .result-list { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .result-item { padding:12px; border:1px solid var(--line); border-radius:10px; cursor:pointer; }
  .result-item:active { border-color:var(--accent); }
  .result-item .name { font-weight:700; }
  .result-item .meta { font-size:12px; color:var(--dim); margin-top:2px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:700; margin-left:6px; }
  .badge.not_purchased { background:#1e2130; color:var(--dim); }
  .badge.verified { background:var(--go-bg); color:var(--go); }
  .badge.pending_verification { background:#3a2e00; color:#f0c419; }
  .badge.rejected { background:var(--stop-bg); color:var(--stop); }
  button { width:100%; padding:13px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-weight:700; font-size:15px; margin-top:16px; }
  button:disabled { opacity:0.5; }
  .row { display:flex; gap:8px; }
  .row > div { flex:1; }
  .banner { border-radius:14px; padding:14px; margin-top:14px; font-size:14px; display:none; }
  .banner.ok { background:var(--go-bg); border:1px solid var(--go); color:#b6e6c8; display:block; }
  .banner.err { background:var(--stop-bg); border:1px solid var(--stop); color:#f3b7c2; display:block; }
  .selected-student { padding:12px; background:#0f1019; border-radius:10px; margin-bottom:4px; }
  .clear-link { font-size:12px; color:var(--dim); text-decoration:underline; float:right; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Sell a Pass</h1><p class="dim" id="who">…</p></div>
    <button id="logout" style="width:auto;background:none;color:var(--dim);font-size:11px;text-decoration:underline;padding:0;margin:0;">Log out</button>
  </header>

  <div class="card" id="search-card">
    <label for="search">Search by name or SAP ID</label>
    <input id="search" placeholder="e.g. Asha or 03" autocomplete="off" />
    <div class="result-list" id="results"></div>
  </div>

  <div class="card" id="sell-card" style="display:none;">
    <span class="clear-link" id="clear-selection">change student</span>
    <div class="selected-student" id="selected-student"></div>

    <label for="pass_type">Pass type</label>
    <select id="pass_type">
      <option value="full">Full Pass</option>
      <option value="no_food">No Food Coupon Pass</option>
    </select>

    <label for="payment_mode">Payment mode</label>
    <select id="payment_mode">
      <option value="cash">Cash</option>
      <option value="upi">UPI</option>
    </select>

    <label for="amount">Amount (₹)</label>
    <input id="amount" type="number" inputmode="decimal" value="300" />

    <div id="upi-fields" style="display:none;">
      <label for="utr">UTR / Transaction reference number</label>
      <input id="utr" placeholder="12-digit UTR from payment confirmation" />
      <label for="screenshot">Payment screenshot</label>
      <input id="screenshot" type="file" accept="image/*" />
    </div>

    <label for="email">Email (only if not already on file)</label>
    <input id="email" type="email" placeholder="student@example.com" />

    <button id="submit-sale">Confirm Sale</button>
    <div class="banner" id="result-banner"></div>
  </div>
</div>

<script>
let selected = null;

async function requireAuth() {
  const res = await fetch("/me");
  if (!res.ok) { window.location.href = "/login-page"; return; }
  const me = await res.json();
  if (!["distributor", "admin"].includes(me.role)) { window.location.href = "/login-page"; return; }
  document.getElementById("who").textContent = `Signed in as ${me.full_name}`;
}
document.getElementById("logout").addEventListener("click", async () => {
  await fetch("/logout", { method: "POST" });
  window.location.href = "/login-page";
});

const searchInput = document.getElementById("search");
const resultsEl = document.getElementById("results");
let searchTimer = null;

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (q.length < 2) { resultsEl.innerHTML = ""; return; }
  searchTimer = setTimeout(() => runSearch(q), 300);
});

async function runSearch(q) {
  const res = await fetch(`/distributor/search?query=${encodeURIComponent(q)}`);
  if (!res.ok) return;
  const students = await res.json();
  resultsEl.innerHTML = "";
  students.forEach(s => {
    const div = document.createElement("div");
    div.className = "result-item";
    div.innerHTML = `<div class="name">${s.name} <span class="badge ${s.payment_status}">${s.payment_status.replace('_',' ')}</span></div>
                      <div class="meta">${s.sap_id} · ${s.branch}${s.gender ? ' · ' + s.gender : ''}</div>`;
    div.addEventListener("click", () => selectStudent(s));
    resultsEl.appendChild(div);
  });
}

function selectStudent(s) {
  selected = s;
  document.getElementById("search-card").style.display = "none";
  document.getElementById("sell-card").style.display = "block";
  document.getElementById("selected-student").innerHTML =
    `<strong>${s.name}</strong><br/><span class="dim">${s.sap_id} · ${s.branch}</span>`;
  document.getElementById("result-banner").className = "banner";
  document.getElementById("result-banner").textContent = "";

  if (s.payment_status !== "not_purchased" && s.payment_status !== "rejected") {
    document.getElementById("submit-sale").disabled = true;
    showBanner(`This pass is already ${s.payment_status.replace('_', ' ')} - cannot sell again.`, "err");
  } else {
    document.getElementById("submit-sale").disabled = false;
  }
}

document.getElementById("clear-selection").addEventListener("click", () => {
  selected = null;
  document.getElementById("sell-card").style.display = "none";
  document.getElementById("search-card").style.display = "block";
  searchInput.value = ""; resultsEl.innerHTML = "";
});

document.getElementById("payment_mode").addEventListener("change", (e) => {
  document.getElementById("upi-fields").style.display = e.target.value === "upi" ? "block" : "none";
});

function showBanner(msg, kind) {
  const el = document.getElementById("result-banner");
  el.className = `banner ${kind}`;
  el.textContent = msg;
}

document.getElementById("submit-sale").addEventListener("click", async () => {
  if (!selected) return;
  const btn = document.getElementById("submit-sale");
  btn.disabled = true; btn.textContent = "Submitting…";

  const formData = new FormData();
  formData.append("sap_id", selected.sap_id);
  formData.append("pass_type", document.getElementById("pass_type").value);
  formData.append("payment_mode", document.getElementById("payment_mode").value);
  formData.append("amount", document.getElementById("amount").value);
  const email = document.getElementById("email").value.trim();
  if (email) formData.append("email", email);

  if (document.getElementById("payment_mode").value === "upi") {
    formData.append("utr_number", document.getElementById("utr").value.trim());
    const file = document.getElementById("screenshot").files[0];
    if (file) formData.append("screenshot", file);
  }

  try {
    const res = await fetch("/distributor/sell", { method: "POST", body: formData });
    const data = await res.json();
    if (res.ok) {
      let msg = data.message;
      if (data.duplicate_screenshot_warning) msg += " ⚠️ This screenshot matches another submission - flagged for treasurer review.";
      showBanner(msg, "ok");
      setTimeout(() => document.getElementById("clear-selection").click(), 2500);
    } else {
      showBanner(data.detail || "Sale failed", "err");
      btn.disabled = false;
    }
  } catch (e) {
    showBanner("Network error — check connection", "err");
    btn.disabled = false;
  }
  btn.textContent = "Confirm Sale";
});

requireAuth();
</script>
</body>
</html>
