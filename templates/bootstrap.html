<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup | Freshers Pass</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at top right, rgba(99, 56, 240, 0.15) 0%, var(--bg-dark) 50%);
        }
        .setup-card {
            width: 100%;
            max-width: 440px;
            position: relative;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .setup-icon {
            width: 56px;
            height: 56px;
            background: rgba(99, 56, 240, 0.1);
            color: var(--primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    
    <div class="setup-card">
        <div class="setup-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        </div>
        
        <h1 class="mb-2">Admin Initialization</h1>
        <p class="text-muted text-sm mb-6" style="line-height: 1.5;">This page works exactly once, before any admin account exists. Enter the <strong>BOOTSTRAP_SECRET</strong> configured in your server environment variables.</p>
        
        <form id="setupForm">
            <div class="form-group">
                <label class="form-label" for="secret">Setup Secret</label>
                <input type="password" id="secret" class="form-control" required autofocus>
            </div>
            
            <hr style="border:0; border-top: 1px solid var(--border); margin: 24px 0;">
            
            <div class="form-group">
                <label class="form-label" for="full_name">Your Full Name</label>
                <input type="text" id="full_name" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="username">Choose Username</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Create Password</label>
                <input type="password" id="password" class="form-control" minlength="8" placeholder="Minimum 8 characters" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 14px;">Initialize System</button>
        </form>
    </div>

    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.getElementById('setupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = 'Processing...';
            btn.disabled = true;

            const body = {
                secret: document.getElementById('secret').value,
                full_name: document.getElementById('full_name').value.trim(),
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/bootstrap-admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    showToast('Admin created successfully! Redirecting...');
                    setTimeout(() => window.location.href = '/login-page', 1800);
                } else {
                    showToast(data.detail || data.message || 'Initialization failed', 'error');
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                showToast('Network error', 'error');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
