<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>One-Time Setup</title>
<style>
  :root { --bg:#0b0c12; --panel:#14151f; --line:#262837; --ink:#eef0f6; --dim:#8b8ea3; --accent:#7c5cff; --stop:#ef3b5c; --stop-bg:#2a0f16; --go:#1fb45c; --go-bg:#0d2617; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  .card { width:100%; max-width:380px; margin:20px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:26px 22px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.sub { color:var(--dim); font-size:12.5px; margin:0 0 20px; line-height:1.5; }
  label { display:block; font-size:12.5px; color:var(--dim); margin:12px 0 6px; }
  label:first-of-type { margin-top:0; }
  input { width:100%; padding:12px; background:#0f1019; border:1px solid var(--line); border-radius:10px; color:var(--ink); font-size:15px; }
  button { width:100%; padding:13px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-weight:700; font-size:15px; margin-top:18px; }
  .msg { display:none; margin-top:14px; padding:10px 12px; border-radius:10px; font-size:13px; }
  .msg.ok { display:block; background:var(--go-bg); border:1px solid var(--go); color:#b6e6c8; }
  .msg.err { display:block; background:var(--stop-bg); border:1px solid var(--stop); color:#f3b7c2; }
</style>
</head>
<body>
  <div class="card">
    <h1>One-Time Admin Setup</h1>
    <p class="sub">This page only works once, before any admin account exists. Use the setup secret you configured in your hosting environment variables.</p>
    <form id="form">
      <label>Setup secret</label>
      <input id="secret" type="password" required />
      <label>Your username</label>
      <input id="username" required />
      <label>Your full name</label>
      <input id="full_name" required />
      <label>Password (min 8 characters)</label>
      <input id="password" type="password" required minlength="8" />
      <button type="submit">Create Admin Account</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = {
    secret: document.getElementById("secret").value,
    username: document.getElementById("username").value.trim(),
    full_name: document.getElementById("full_name").value.trim(),
    password: document.getElementById("password").value,
  };
  const msg = document.getElementById("msg");
  try {
    const res = await fetch("/bootstrap-admin", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await res.json();
    msg.className = `msg ${res.ok ? "ok" : "err"}`;
    msg.textContent = data.message || data.detail;
    if (res.ok) {
      setTimeout(() => window.location.href = "/login-page", 1800);
    }
  } catch (err) {
    msg.className = "msg err"; msg.textContent = "Network error";
  }
});
</script>
</body>
</html>
